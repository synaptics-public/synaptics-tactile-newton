[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synaptics-tactile-newton"
version = "1.0.1"
description = "Synaptics CTS tactile sensor model for Newton physics engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # ``sim`` brings the MuJoCo-Warp solver, ``importers`` the USD reader that
    # loads the bundled sensor asset.
    "newton[sim,importers]>=1.2",
    "warp-lang>=1.13",
    "numpy",
]

[project.optional-dependencies]
viewer = ["rerun-sdk"]
test = ["pytest>=7.0"]
# Optional Isaac Lab wrapper (synaptics_tactile_newton.isaaclab). Requires Isaac
# Lab 3.0+, the first release with the Newton backend. Never pulled by the core
# install.
#
# NOTE: Isaac Lab 3.0+ is NOT on PyPI yet, so `pip install
# synaptics-tactile-newton[isaaclab]` cannot resolve this pin from an index
# today. Install Isaac Lab from a local source checkout instead, e.g.
# `./setup_newton.sh --with-isaaclab /path/to/IsaacLab`. This pin is a
# placeholder for when 3.0 ships on PyPI.
isaaclab = ["isaaclab>=3.0"]

[tool.setuptools.packages.find]
include = ["synaptics_tactile_newton*"]

[tool.setuptools.package-data]
"synaptics_tactile_newton" = ["assets/*.usd", "assets/*.usda", "assets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v"]
markers = [
    "sim: slow Newton simulation test (needs newton + the CTS sensor USD)",
    "unit: fast Winkler algorithm test (needs newton; no solver, no USD)",
]
